  if(s.kind==='click'){g={p:+p,n:++n,step:s.step,shots:[],index:groups.length};groups.push(g);}
  g.shots.push(s);
 });
}
const counter=document.getElementById('counter');
let idx=0, tl=null, version=0, playing=false, actual=0, input='', timer, presenter=null, hideCounter=false;
const channelId=new URLSearchParams(location.search).get('sync')||('flow-'+Math.random().toString(36).slice(2));
let bc; try{bc=new BroadcastChannel(channelId);}catch{}
const key=g=>`p${String(g.p).padStart(2,'0')}s${g.n}`;
const firstIndex=p=>groups.findIndex(g=>g.p===p);
const limit=n=>Math.max(0,Math.min(n,groups.length-1));
function syncCounter(){const g=groups[idx];counter.hidden=hideCounter||preview||(g.p===10&&g.step===3)||(g.p===11&&g.step===1)||g.p===24;}
function update(){
 const g=groups[idx], shot=g.shots[actual]||g.shots[0];
 const pageGroups=groups.filter(q=>q.p===g.p), stepGroups=pageGroups.filter(q=>q.step===g.step);
 counter.value=`${g.p} · ${g.n}/${pageGroups.length}`;
 syncCounter();
 const hash='#'+key(g);
 if(location.hash!==hash)history.replaceState(null,'',hash);
 const ng=groups[idx+1], nextShot=ng?.shots[ng.shots.length-1];
 const data={type:'state',p:g.p,n:g.n,step:g.step,total:pageGroups.length,
 stepIndex:stepGroups.indexOf(g),stepTotal:stepGroups.length,shot:shot.meta,
 next:ng?.shots[0]?.meta, previewPage:nextShot?.p,previewFrame:nextShot?.i,
 currentGroup:g.shots.map(x=>x.meta),nextPage:ng?.p,nextStep:ng?.n,playing};
 try{bc?.postMessage(data);presenter?.postMessage(data,'*');}catch{}
}
function apply(shot,instant){
 const {objects,routes}=shot.state();
 particles(routes);
 return transition(objects,shot.dur,instant);
}
function cancel(){version++;tl?.kill();tl=null;playing=false;}
function seek(i){cancel();idx=limit(i);actual=groups[idx].shots.length-1;apply(groups[idx].shots[actual],true);update();}
function play(i){
 cancel();idx=limit(i);const id=version;actual=0;playing=true;
 function run(){
  const s=groups[idx].shots[actual];
  tl=apply(s,false);update();
  tl.eventCallback('onComplete',()=>{
   if(id!==version)return;
   apply(s,true);
   if(actual+1<groups[idx].shots.length){actual++;run();}
   else {tl=null;playing=false;update();}
  });
  tl.play();
 }
 run();
}
function next(){if(playing)seek(idx);else if(idx<groups.length-1)play(idx+1);}
function prev(){seek(idx-1);}
function jump(p){const i=firstIndex(p);if(i>=0)seek(i);}
function fromHash(){const m=location.hash.match(/^#p(\d{1,2})(?:s(\d+))?$/i);if(!m)return -1;return groups.findIndex(g=>g.p===+m[1]&&g.n===+(m[2]||1));}
function full(){
 const d=document,e=d.documentElement;
 try{
 const p=(d.fullscreenElement||d.webkitFullscreenElement)?(d.exitFullscreen||d.webkitExitFullscreen)?.call(d):(e.requestFullscreen||e.webkitRequestFullscreen)?.call(e);
 p?.catch(()=>{});
 }catch{}
}
function receive(d){if(!d)return;if(d.type==='hello')update();if(d.type==='next')next();if(d.type==='prev')prev();if(d.type==='jump')jump(d.p);}
if(bc)bc.onmessage=e=>receive(e.data);
window.addEventListener('message',e=>{if(e.source===presenter)receive(e.data);});
const preview=new URLSearchParams(location.search).has('preview');
if(!preview){
 addEventListener('hashchange',()=>{const i=fromHash();if(i>=0)seek(i);});
 document.getElementById('screen').addEventListener('click',e=>{if(e.button===0)next();});
 addEventListener('keydown',e=>{
  if(e.metaKey||e.altKey||e.ctrlKey||e.repeat)return;
  const k=e.key.toLowerCase();
  if(/^\d$/.test(k)){input=(input+k).slice(-2);clearTimeout(timer);timer=setTimeout(()=>input='',4000);return;}
  if(k==='enter'&&input){jump(+input);input='';e.preventDefault();return;}
  const actions={arrowright:next,' ':next,pagedown:next,arrowleft:prev,pageup:prev,home:()=>seek(0),f:full,h:()=>{hideCounter=!hideCounter;syncCounter();}};
  if(actions[k]){e.preventDefault();actions[k]();}
 });
}else counter.hidden=true;
const start=fromHash();
if(preview){
 const params=new URLSearchParams(location.search), p=Number(params.get('page')), i=Number(params.get('frame')), s=pages[p]?.[i];
 if(s){idx=groups.findIndex(g=>g.p===p&&g.n===s.step);actual=groups[idx].shots.indexOf(s);apply(s,true);update();}
 else seek(start>=0?start:0);
}else if(start>=0)seek(start);else play(0);
window.Deck={groups,all,seek,play,next,prev,jump,current:()=>({idx,actual,playing}),frame:(p,i)=>{const s=pages[p][i];cancel();idx=groups.findIndex(g=>g.p===p&&g.n===s.step);actual=groups[idx].shots.indexOf(s);apply(s,true);update();}};
})();
</script></body></html>
